<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>استرجاع كلمة السر — Genix Gym</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body{font-family:-apple-system,'Segoe UI',Tahoma,sans-serif;background:#07080b;color:#f1f4f9;
    max-width:420px;margin:0 auto;padding:60px 24px;line-height:1.7}
  h1{color:#c9ff57;font-size:22px;text-align:center}
  p{color:#98a1b3;font-size:14px;text-align:center}
  input{width:100%;box-sizing:border-box;background:#1b202b;border:1px solid #242b38;border-radius:10px;
    padding:14px;color:#f1f4f9;font-size:15px;margin-top:16px}
  button{width:100%;background:#c9ff57;color:#0c1206;border:none;border-radius:10px;
    padding:15px;font-weight:800;font-size:15px;margin-top:16px;cursor:pointer}
  button:disabled{opacity:.5}
  .msg{margin-top:16px;text-align:center;font-size:13px}
  .ok{color:#c9ff57}
  .err{color:#ff5d73}
</style>
</head>
<body>

<h1>🔒 كلمة سر جديدة</h1>
<p>اكتب كلمة السر الجديدة بتاعتك</p>

<input id="pw" type="password" placeholder="كلمة السر الجديدة (6 حروف على الأقل)">
<button id="btn">احفظ كلمة السر</button>
<div id="msg" class="msg"></div>

<script>
  // نفس بيانات المشروع المستخدمة في التطبيق بالظبط
  const SUPABASE_URL = 'https://iiqjfvdtyzirqkcunmjb.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlpcWpmdmR0eXppcnFrY3VubWpiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUxNzA3MjcsImV4cCI6MjEwMDc0NjcyN30.yOPop9sXLBUecM-sMYvieFB65apc8R7Xi5pmfVVggUE';

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const msgEl = document.getElementById('msg');
  const btn = document.getElementById('btn');

  btn.addEventListener('click', async () => {
    const pw = document.getElementById('pw').value;
    if (!pw || pw.length < 6) {
      msgEl.className = 'msg err';
      msgEl.textContent = 'كلمة السر لازم تكون 6 حروف على الأقل';
      return;
    }
    btn.disabled = true;
    btn.textContent = 'بيحفظ...';
    const { error } = await sb.auth.updateUser({ password: pw });
    btn.disabled = false;
    btn.textContent = 'احفظ كلمة السر';
    if (error) {
      msgEl.className = 'msg err';
      msgEl.textContent = 'حصل خطأ — جرب تفتح الرابط من إيميلك تاني';
    } else {
      msgEl.className = 'msg ok';
      msgEl.textContent = '✅ اتغيّرت! ارجع للتطبيق وسجّل دخول بكلمة السر الجديدة';
      document.getElementById('pw').style.display = 'none';
      btn.style.display = 'none';
    }
  });
</script>
</body>
</html>
