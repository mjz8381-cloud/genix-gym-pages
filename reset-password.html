<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>استرجاع كلمة السر — Genix Gym</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *{box-sizing:border-box}
  body{
    font-family:-apple-system,'Segoe UI',Tahoma,sans-serif;
    background:#07080b;
    color:#f1f4f9;
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    position:relative;
    overflow:hidden;
  }
  .orb{position:absolute;border-radius:50%;filter:blur(2px);opacity:.18;pointer-events:none}
  .orb1{width:280px;height:280px;background:#c9ff57;top:-100px;right:-80px}
  .orb2{width:220px;height:220px;background:#8f7bff;bottom:-80px;left:-60px}
  .card{
    position:relative;
    width:100%;
    max-width:380px;
    background:#151922;
    border:1px solid #242b38;
    border-radius:22px;
    padding:36px 28px;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
  }
  .logo-row{display:flex;align-items:center;justify-content:center;gap:9px;margin-bottom:6px}
  .dot{width:9px;height:9px;border-radius:50%;background:#c9ff57;box-shadow:0 0 12px #c9ff57}
  .logo-text{font-weight:800;font-size:19px;color:#f1f4f9}
  .slogan{color:#c9ff57;font-size:10.5px;font-weight:700;text-align:center;letter-spacing:1.5px;margin-bottom:28px}
  h1{color:#f1f4f9;font-size:20px;text-align:center;margin:0 0 8px}
  p.sub{color:#98a1b3;font-size:13px;text-align:center;margin:0 0 24px;line-height:1.6}
  input{
    width:100%;background:#1b202b;border:1px solid #242b38;border-radius:12px;
    padding:14px 16px;color:#f1f4f9;font-size:15px;margin-top:4px;
  }
  input:focus{outline:none;border-color:#c9ff57}
  button{
    width:100%;background:#c9ff57;color:#0c1206;border:none;border-radius:12px;
    padding:15px;font-weight:800;font-size:15px;margin-top:18px;cursor:pointer;
    box-shadow:0 8px 24px rgba(201,255,87,.25);
  }
  button:disabled{opacity:.5;cursor:default}
  .msg{margin-top:16px;text-align:center;font-size:13px;line-height:1.6}
  .ok{color:#c9ff57}
  .err{color:#ff5d73}
</style>
</head>
<body>
<div class="orb orb1"></div>
<div class="orb orb2"></div>

<div class="card">
  <div class="logo-row"><div class="dot"></div><div class="logo-text">Genix Gym</div></div>
  <div class="slogan">TIME IN. RESULTS OUT.</div>

  <h1>🔒 كلمة سر جديدة</h1>
  <p class="sub">اكتب كلمة السر الجديدة بتاعتك، وارجع للتطبيق تسجّل دخول بيها</p>

  <input id="pw" type="password" placeholder="كلمة السر الجديدة (6 حروف على الأقل)">
  <button id="btn">احفظ كلمة السر</button>
  <div id="msg" class="msg"></div>
</div>

<script>
  const SUPABASE_URL = 'https://iiqjfvdtyzirqkcunmjb.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlpcWpmdmR0eXppcnFrY3VubWpiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUxNzA3MjcsImV4cCI6MjEwMDc0NjcyN30.yOPop9sXLBUecM-sMYvieFB65apc8R7Xi5pmfVVggUE';

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const msgEl = document.getElementById('msg');
  const btn = document.getElementById('btn');
  const pwEl = document.getElementById('pw');

  btn.addEventListener('click', async () => {
    const pw = pwEl.value;
    if (!pw || pw.length < 6) {
      msgEl.className = 'msg err';
      msgEl.textContent = 'كلمة السر لازم تكون 6 حروف على الأقل';
      return;
    }
    btn.disabled = true;
    btn.textContent = 'بيحفظ...';
    const { error } = await sb.auth.updateUser({ password: pw });
    btn.disabled = false;
    btn.textContent = 'احفظ كلمة السر';
    if (error) {
      msgEl.className = 'msg err';
      msgEl.textContent = 'الرابط ده منتهي أو مستخدم قبل كده — ارجع للتطبيق واطلب رابط جديد';
    } else {
      msgEl.className = 'msg ok';
      msgEl.textContent = '✅ اتغيّرت! ارجع للتطبيق وسجّل دخول بكلمة السر الجديدة';
      pwEl.style.display = 'none';
      btn.style.display = 'none';
    }
  });
</script>
</body>
</html>
